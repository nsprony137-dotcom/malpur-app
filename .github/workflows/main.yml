name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build APK
      run: |
        # यह कमांड अपने आप ढूंढ लेगी कि build.gradle फ़ाइल किस फोल्डर के अंदर है और वहीं से APK बना देगी
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Found project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MalpurPanchayatApp-Final
        path: |
          **/build/outputs/apk/debug/*.apk
