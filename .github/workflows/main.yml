name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle 7.5
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

    - name: Find and Build
      run: |
        unzip -q MalpurPanchayatApp_v2.zip -d ./unzipped
        PROJECT_DIR=$(find ./unzipped -name "build.gradle" -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        gradle assembleDebug --warning-mode none

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: unzipped/**/build/outputs/apk/debug/*.apk
        
