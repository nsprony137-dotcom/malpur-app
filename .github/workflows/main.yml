name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean and Build APK
      run: |
        # यहाँ हम प्रोजेक्ट के अंदर छिपी हुई सभी फाइलों को ढूंढकर उसे सही से बिल्ड करेंगे
        # यह किसी भी फोल्डर स्ट्रक्चर में काम करेगा
        find . -maxdepth 3 -name "gradlew" -exec chmod +x {} \;
        
        # अगर gradlew नहीं मिला, तो हम डायरेक्ट Gradle रन करेंगे
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MalpurPanchayatApp-Final
        path: |
          **/build/outputs/apk/debug/*.apk
          **/app/build/outputs/apk/debug/*.apk
