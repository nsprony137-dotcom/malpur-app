name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Setup Wrapper
      run: |
        unzip -q MalpurPanchayatApp_v2.zip -d ./unzipped
        PROJECT_DIR=$(find ./unzipped -name "build.gradle" -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        gradle wrapper --gradle-version 8.0 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: unzipped/**/build/outputs/apk/debug/*.apk
        
